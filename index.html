<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 Service Unavailable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0f;
            color: #a0a0b0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .content {
            max-width: 500px;
            width: 100%;
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .title {
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 1rem;
            color: #7e7e8c;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .divider {
            width: 60px;
            height: 1px;
            background-color: #262635;
            margin: 0 auto 2rem auto;
            border: none;
        }

        .note {
            font-size: 0.85rem;
            color: #5e5e6e;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .reference-box {
            background-color: #0e0e14;
            border: 1px solid #1c1c28;
            border-radius: 6px;
            padding: 0.7rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }

        .ref-label {
            color: #545466;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .ref-code {
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #3f3f50;
        }

        .copy-btn {
            background: none;
            border: 1px solid #262636;
            color: #6a6a7c;
            padding: 0.2rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background-color: #1a1a26;
            color: #ccc;
        }

        .timestamp {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #4a4a5c;
        }
    </style>
</head>
<body>
    <div class="content">
        <!-- Büyük yasak simgesi (isteğe bağlı değiştir: 🚫 ⛔ 🛑) -->
        <div class="icon">🛑</div>

        <div class="title">503 Service Unavailable</div>
        <div class="subtitle">
            This site has been permanently shut down.
        </div>

        <hr class="divider">

        <div class="note">
            All inbound requests are rejected. No further action is<br>
            required from visitors. If you are the administrator,<br>
            verify your infrastructure settings.
        </div>

        <!-- Referans kodu (statik, istersen dinamik yapabiliriz) -->
        <div class="reference-box">
            <span class="ref-label">Ref</span>
            <span class="ref-code">x9Ym2LpQ_3wTrfK1nsO_Ag</span>
            <button class="copy-btn" onclick="copyRef()">Copy</button>
        </div>

        <!-- Canlı sunucu saati -->
        <div class="timestamp" id="liveTimestamp">--</div>
    </div>

    <script>
        // Canlı UTC saat
        function updateTime() {
            const now = new Date();
            const iso = now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            document.getElementById('liveTimestamp').textContent = iso;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Copy fonksiyonu
        function copyRef() {
            const code = document.querySelector('.ref-code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied';
                setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
            });
        }
    </script>
</body>
</html>
