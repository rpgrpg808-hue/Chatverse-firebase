<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Unavailable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f0e17;
            color: #a7a9be;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            font-weight: 400;
        }
        .container {
            max-width: 560px;
            padding: 2rem;
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 500;
            color: #fffffe;
            margin-bottom: 0.8rem;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 0.95rem;
            color: #a7a9be;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .note {
            font-size: 0.8rem;
            color: #5c5b6e;
            margin-bottom: 2rem;
        }
        .footer {
            font-size: 0.75rem;
            color: #5c5b6e;
            border-top: 1px solid #2c2a3a;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        a {
            color: #7f5af0;
            text-decoration: none;
            border: 1px solid #7f5af0;
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            font-size: 0.85rem;
            transition: 0.2s;
            display: inline-block;
            margin-top: 0.5rem;
        }
        a:hover {
            background-color: #7f5af0;
            color: #fffffe;
        }
        .request-id {
            font-family: monospace;
            font-size: 0.7rem;
            color: #4a4957;
            margin-top: 2rem;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>Service Unavailable</h1>
        <p>
            This service is currently offline. No further access is permitted.
        </p>
        <div class="note">
            If you are the administrator, check your infrastructure settings.<br>
            Otherwise, this endpoint is intentionally disabled.
        </div>
        <div class="footer">
            End of service
        </div>
        <div class="request-id">
            REQUEST ID: x9Ym2LpQ_3wTrfK1nsO_Ag
        </div>
    </div>
</body>
</html>
